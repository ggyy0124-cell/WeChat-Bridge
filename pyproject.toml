[project]
name = "wechat-bridge"
version = "1.4.0+0.1"  # PEP 440 本地版本写法，对应发布版本 v1.4.0-0.1（基于上游 1.4.0 的下游修订 0.1）
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/ggyy0124-cell/WeChat-Bridge"
Documentation = "https://github.com/ggyy0124-cell/WeChat-Bridge/tree/main/docs"
Repository = "https://github.com/ggyy0124-cell/WeChat-Bridge"
Issues = "https://github.com/ggyy0124-cell/WeChat-Bridge/issues"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (由 formatter 管理)
    "B904",  # raise without from (历史代码兼容)
]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "bridge", "config", "db", "ilink", "media", "delivery", "commands", "keepalive", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # 测试文件需要在 import 前操作 sys.path / 安装 stub
"app/**" = ["E402"]   # __future__ + docstring 在 import 之前，全目录统一豁免

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
